<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111a18">
  <title>Hacia dónde miras — sección interactiva</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #111a18;
      --paper: #eef0e7;
      --quiet: #aab4a7;
      --lime: #d4f76a;
      --orange: #ff783f;
      --line: rgb(238 240 231 / 17%);
      font-family: Arial, Helvetica, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { min-height: 100%; margin: 0; }

    body { background: var(--night); color: var(--paper); }

    .filter-defs { position: absolute; width: 0; height: 0; overflow: hidden; }

    .hero {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: 100%;
      min-height: 720px;
      height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 52% 61%, rgb(145 169 94 / 17%) 0, rgb(145 169 94 / 5%) 24%, transparent 53%),
        var(--night);
    }

    .hero::before {
      position: absolute;
      z-index: -1;
      inset: 0;
      content: "";
      pointer-events: none;
      opacity: .23;
      background-image: radial-gradient(rgb(238 240 231 / 55%) .55px, transparent .65px);
      background-size: 5px 5px;
      mask-image: linear-gradient(90deg, #000, transparent 45%, #000);
    }

    .topbar, .bottombar {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-inline: clamp(22px, 5vw, 76px);
    }

    .topbar {
      min-height: 76px;
      border-bottom: 1px solid var(--line);
      color: var(--quiet);
      font: 10px/1.2 "Courier New", monospace;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .wordmark { color: var(--paper); font-size: 12px; letter-spacing: .08em; }
    .wordmark b { color: var(--orange); font-weight: 700; }
    .live { display: flex; align-items: center; gap: 9px; }
    .live::before { width: 6px; height: 6px; border-radius: 50%; background: var(--lime); content: ""; box-shadow: 0 0 12px rgb(212 247 106 / 55%); }

    .stage {
      position: relative;
      display: grid;
      min-height: 0;
      grid-template-columns: minmax(0, 1fr) minmax(160px, .65fr);
      align-items: center;
      padding: 0 clamp(22px, 5vw, 76px);
      touch-action: pan-y;
      outline: none;
      cursor: ew-resize;
    }

    .stage:focus-visible::after {
      position: absolute;
      inset: 12px clamp(12px, 2.5vw, 38px);
      border: 1px solid rgb(212 247 106 / 65%);
      content: "";
      pointer-events: none;
    }

    .copy {
      position: relative;
      z-index: 2;
      align-self: center;
      width: min(40vw, 470px);
      margin-top: -16px;
      pointer-events: none;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 11px;
      margin: 0 0 24px;
      color: var(--lime);
      font: 10px/1.4 "Courier New", monospace;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .eyebrow::before { width: 23px; height: 1px; background: var(--lime); content: ""; }

    h1 {
      max-width: 540px;
      margin: 0;
      font-size: clamp(56px, 7.1vw, 104px);
      font-weight: 760;
      line-height: .88;
      letter-spacing: -.085em;
    }

    h1 span { display: block; }
    h1 .accent { color: var(--orange); }

    .intro {
      max-width: 300px;
      margin: 25px 0 0 3px;
      color: var(--quiet);
      font-size: 13px;
      line-height: 1.65;
    }

    .robot-wrap {
      position: absolute;
      z-index: 1;
      top: 50%;
      left: 52%;
      width: min(92vw, 1210px);
      transform: translate(-50%, -47%);
      pointer-events: none;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 85%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 0%, #000 85%, transparent 100%);
    }

    #source {
      display: block;
      width: 100%;
      height: auto;
      transform-origin: center;
      filter: url(#robot-chroma-key) drop-shadow(0 24px 34px rgb(0 0 0 / 15%));
    }

    .readout {
      position: relative;
      z-index: 2;
      justify-self: end;
      align-self: center;
      width: 160px;
      margin: 128px 4px 0 0;
      padding: 13px 0 0 14px;
      border-top: 1px solid rgb(212 247 106 / 55%);
      color: var(--quiet);
      font: 9px/1.7 "Courier New", monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .readout strong { display: block; margin-top: 4px; color: var(--paper); font-size: 11px; font-weight: 500; }

    .bottombar {
      min-height: 81px;
      border-top: 1px solid var(--line);
      color: var(--quiet);
      font: 10px/1.3 "Courier New", monospace;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .scrub-guide { display: flex; flex: 1; align-items: center; gap: clamp(10px, 2vw, 28px); max-width: 485px; color: var(--paper); }
    .scrub-guide span:first-child, .scrub-guide span:last-child { white-space: nowrap; }

    .track { position: relative; flex: 1; height: 1px; background: rgb(238 240 231 / 30%); }
    .track::before, .track::after { position: absolute; top: -2px; width: 5px; height: 5px; border: 1px solid var(--quiet); border-radius: 50%; background: var(--night); content: ""; }
    .track::before { left: 0; }
    .track::after { right: 0; }
    .track i { position: absolute; top: -4px; left: 50%; width: 9px; height: 9px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 12px rgb(212 247 106 / 58%); transform: translateX(-50%); }

    .foot-note { white-space: nowrap; }
    .foot-note b { color: var(--orange); font-weight: 400; }

    @media (max-width: 700px) {
      .hero { min-height: 680px; }
      .topbar, .bottombar { margin-inline: 21px; }
      .topbar { min-height: 60px; font-size: 8px; }
      .live { gap: 6px; }
      .stage { grid-template-columns: 1fr; align-items: start; padding: 0 22px; }
      .copy { width: min(88vw, 390px); margin-top: clamp(44px, 10vh, 88px); }
      .eyebrow { margin-bottom: 17px; font-size: 9px; }
      h1 { max-width: 400px; font-size: clamp(55px, 14.6vw, 83px); }
      .intro { width: 225px; margin-top: 15px; font-size: 12px; }
      .robot-wrap { top: 65%; left: 50%; width: 246vw; max-width: 1000px; transform: translate(-50%, -50%); }
      .readout { position: absolute; right: 19px; bottom: 41px; width: auto; max-width: 122px; margin: 0; font-size: 8px; }
      .readout strong { font-size: 9px; }
      .bottombar { min-height: 64px; font-size: 8px; }
      .scrub-guide { gap: 9px; max-width: 280px; }
      .foot-note { display: none; }
    }

    @media (max-height: 760px) and (min-width: 701px) {
      .robot-wrap { width: min(78vw, 960px); }
      h1 { font-size: clamp(54px, 6.7vw, 86px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <svg class="filter-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <filter id="robot-chroma-key" color-interpolation-filters="sRGB" x="-5%" y="-5%" width="110%" height="110%">
      <feColorMatrix type="matrix" values="
        1.495 -0.495 0 0 0
        1.5075 -0.5075 0 0 0
        0.54 -0.54 1 0 0
        2.25 -2.25 0 0 1
      "/>
    </filter>
  </svg>
  <main>
    <section class="hero" aria-labelledby="title">
      <header class="topbar">
        <div class="wordmark">NODO <b>—</b> interacción sintética</div>
        <div class="live">Sistema activo</div>
      </header>

      <div class="stage" id="stage" role="slider" tabindex="0" aria-label="Mueve la mirada del robot a izquierda o derecha" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
        <div class="copy">
          <p class="eyebrow">Atención, en tiempo real</p>
          <h1 id="title"><span>Hacia dónde</span><span class="accent">miras.</span></h1>
          <p class="intro">Una presencia que sigue tu dirección. Mueve el cursor y encuentra su mirada.</p>
        </div>

        <div class="robot-wrap" aria-hidden="true">
          <video id="source" src="robot-recorte.mp4" muted playsinline preload="auto"></video>
        </div>

        <div class="readout" aria-hidden="true">Vector de mirada<strong id="gaze">Al centro</strong></div>
      </div>

      <footer class="bottombar">
        <div class="scrub-guide" aria-hidden="true">
          <span>Izquierda</span><div class="track"><i id="marker"></i></div><span>Derecha</span>
        </div>
        <div class="foot-note">Interfaz <b>01</b> &nbsp;·&nbsp; Controla con el mouse</div>
      </footer>
    </section>
  </main>

  <script>
    (() => {
      const stage = document.querySelector('#stage');
      const video = document.querySelector('#source');
      const gaze = document.querySelector('#gaze');
      const marker = document.querySelector('#marker');
      let desiredPosition = 0.5;
      let displayedPosition = 0.5;
      let seeking = false;
      let animationFrame = 0;

      function animate() {
        animationFrame = 0;
        const difference = desiredPosition - displayedPosition;
        displayedPosition = Math.abs(difference) < 0.001 ? desiredPosition : displayedPosition + difference * 0.28;

        const isLeft = displayedPosition < 0.5;
        const progress = isLeft ? (1 - displayedPosition * 2) : (displayedPosition * 2 - 1);
        video.style.transform = isLeft ? 'scaleX(1)' : 'scaleX(-1)';

        if (!seeking && Number.isFinite(video.duration) && video.duration > 0) {
          const frameTime = 1 / 60;
          const target = Math.round(progress * video.duration / frameTime) * frameTime;
          if (Math.abs(video.currentTime - target) >= frameTime * 0.5) {
            seeking = true;
            video.currentTime = Math.min(target, Math.max(0, video.duration - frameTime));
          }
        }

        if (Math.abs(desiredPosition - displayedPosition) > 0.001) scheduleAnimation();
      }

      function scheduleAnimation() {
        if (!animationFrame) animationFrame = requestAnimationFrame(animate);
      }

      function setPosition(value) {
        desiredPosition = Math.max(0, Math.min(1, value));
        marker.style.left = `${desiredPosition * 100}%`;
        stage.setAttribute('aria-valuenow', String(Math.round(desiredPosition * 100)));
        gaze.textContent = desiredPosition < 0.43 ? 'A la izquierda' : desiredPosition > 0.57 ? 'A la derecha' : 'Al centro';
        scheduleAnimation();
      }

      stage.addEventListener('pointermove', (event) => {
        const bounds = stage.getBoundingClientRect();
        setPosition((event.clientX - bounds.left) / bounds.width);
      });

      stage.addEventListener('pointerleave', () => setPosition(0.5));

      stage.addEventListener('keydown', (event) => {
        if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
        event.preventDefault();
        setPosition(desiredPosition + (event.key === 'ArrowRight' ? 0.04 : -0.04));
      });

      video.addEventListener('loadeddata', () => setPosition(0.5));
      video.addEventListener('seeked', () => {
        seeking = false;
        scheduleAnimation();
      });
      video.addEventListener('error', () => console.error('No se pudo cargar robot-recorte.mp4'));
    })();
  </script>
</body>
</html>
